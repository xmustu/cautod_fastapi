<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Email - {{ project_name }}</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px;">
    <div style="background-color: #f8f9fa; padding: 20px; border-radius: 5px;">
        <h1 style="color: #2c3e50; margin-top: 0;">{{ project_name }}</h1>
        <h2 style="color: #3498db;">Test Email</h2>
        
        <p>Hello,</p>
        
        <p>This is a test email from <strong>{{ project_name }}</strong>.</p>
        
        <p>If you received this email, it means the email service is configured correctly.</p>
        
        <div style="background-color: #d4edda; border-left: 4px solid #28a745; padding: 15px; margin: 20px 0; border-radius: 3px;">
            <p style="margin: 0;"><strong>✓ Email sent to:</strong> {{ email }}</p>
        </div>
        
        <p style="font-size: 0.8em; color: #95a5a6; margin-top: 30px;">
            This is an automated test email from {{ project_name }}.
        </p>
    </div>
</body>
</html>
